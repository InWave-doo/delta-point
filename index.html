<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delta Point</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #fafafa;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container { text-align: center; padding: 32px; }
    .logo {
      font-size: 14px; font-weight: 600; letter-spacing: 0.04em;
      color: #6366f1; text-transform: uppercase; margin-bottom: 24px;
    }
    h1 { font-size: 36px; font-weight: 600; margin-bottom: 12px; line-height: 1.2; }
    .tagline { font-size: 18px; color: #52526b; margin-bottom: 32px; }
    .badge {
      display: inline-block; background: #ede9fe; color: #6366f1;
      font-size: 13px; font-weight: 500; padding: 6px 16px;
      border-radius: 20px; margin-bottom: 40px;
    }
    .contact { font-size: 14px; color: #71717a; }
    .contact a { color: #6366f1; text-decoration: none; }
    .contact a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Delta Point</div>
    <h1>Data infrastructure<br>for growing brands</h1>
    <p class="tagline">Automated analytics pipelines connecting your store, ads, and marketing data.</p>
    <div class="badge">Coming soon</div>
    <p class="contact"><a href="mailto:admin@inwave-consulting.com">Get in touch</a></p>
  </div>
</body>
</html>
